[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "appdraft"
version = "0.1.2"
description = "Questionari desktop locali da template Markdown"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "PyYAML>=6,<7", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
appdraft = "questionnaire_tool.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
questionnaire_tool = ["resources/templates/*.md", "resources/icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.release]
checks = [["{python}", "-m", "pytest", "-q"]]
build = ["{python}", "-m", "PyInstaller", "--noconfirm", "--clean", "AppDraft.spec"]

[tool.release.assets]
win32 = ["dist/AppDraft.exe"]
darwin = ["dist/AppDraft.app"]
