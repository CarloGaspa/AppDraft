name: Release Windows and macOS
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: AppDraft-Windows-x64.exe
            arch: x64
          - os: macos-15
            asset: AppDraft-macOS-arm64.zip
            arch: arm64
          - os: macos-15-intel
            asset: AppDraft-macOS-x64.zip
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_ASSET: ${{ matrix.asset }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Validate version and tag
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match pyproject.toml version')
          PY
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean AppDraft.spec
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p release-assets
          cp dist/AppDraft.exe "release-assets/$RELEASE_ASSET"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent dist/AppDraft.app "release-assets/$RELEASE_ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: AppDraft-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
